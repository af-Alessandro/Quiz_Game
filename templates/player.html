<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Partecipa al Quiz</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ asset_version }}" />
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  </head>
  <body class="player-page">
    <main class="phone-shell">
      <section id="login" class="screen player-login">
        <p class="eyebrow">Game room</p>
        <h1>Entra nel quiz</h1>
        <div class="form-stack">
          <label for="pin">PIN</label>
          <input
            type="text"
            id="pin"
            inputmode="numeric"
            autocomplete="one-time-code"
            placeholder="1234"
            value="{{ pin }}"
          />
          <label for="name">Nome</label>
          <input type="text" id="name" autocomplete="nickname" placeholder="Il tuo nome" />
          <button class="primary-btn" type="button" onclick="join()">Entra</button>
        </div>
        <p id="login-error" class="error-message" role="alert"></p>
      </section>

      <section id="game" class="screen answer-screen hidden">
        <div class="player-statusbar">
          <p class="eyebrow">Sei dentro</p>
          <div class="mini-timer">
            <span id="player-timer">35</span>
          </div>
        </div>
        <h1 id="status-msg">Attendi la domanda</h1>
        <div id="buttons" class="answer-grid hidden">
          <button class="answer-btn red" type="button" onclick="sendAnswer(0)">
            <span>A</span>
            <strong></strong>
          </button>
          <button class="answer-btn blue" type="button" onclick="sendAnswer(1)">
            <span>B</span>
            <strong></strong>
          </button>
          <button class="answer-btn yellow" type="button" onclick="sendAnswer(2)">
            <span>C</span>
            <strong></strong>
          </button>
          <button class="answer-btn green" type="button" onclick="sendAnswer(3)">
            <span>D</span>
            <strong></strong>
          </button>
        </div>
        <div id="player-result" class="player-result hidden"></div>
      </section>
    </main>

    <script>
      const socket = io();
      const login = document.getElementById("login");
      const game = document.getElementById("game");
      const buttons = document.getElementById("buttons");
      const statusMsg = document.getElementById("status-msg");
      const errorMsg = document.getElementById("login-error");
      const resultBox = document.getElementById("player-result");
      const playerIdKey = "quiz_player_id";
      const playerNameKey = "quiz_player_name";
      let timerId = null;
      let answered = false;
      let joined = false;

      const savedName = localStorage.getItem(playerNameKey);
      if (savedName) {
        document.getElementById("name").value = savedName;
      }

      function getPlayerId() {
        let playerId = localStorage.getItem(playerIdKey);
        if (!playerId) {
          playerId = crypto.randomUUID
            ? crypto.randomUUID()
            : `${Date.now()}-${Math.random().toString(16).slice(2)}`;
          localStorage.setItem(playerIdKey, playerId);
        }
        return playerId;
      }

      function stopTimer() {
        if (timerId) {
          clearInterval(timerId);
          timerId = null;
        }
      }

      function startTimer(seconds) {
        stopTimer();
        let remaining = seconds ?? 35;
        document.getElementById("player-timer").textContent = remaining;

        timerId = setInterval(() => {
          remaining -= 1;
          document.getElementById("player-timer").textContent = Math.max(0, remaining);
          if (remaining <= 0) {
            stopTimer();
            buttons.classList.add("hidden");
            if (!answered) {
              statusMsg.textContent = "Tempo scaduto";
            }
          }
        }, 1000);
      }

      function join() {
        const pin = document.getElementById("pin").value.trim();
        const name = document.getElementById("name").value.trim();

        errorMsg.textContent = "";
        if (!pin || !name) {
          errorMsg.textContent = "Inserisci PIN e nome.";
          return;
        }

        socket.emit("join_game", { pin, name, player_id: getPlayerId() });
      }

      function showGame() {
        login.classList.add("hidden");
        game.classList.remove("hidden");
      }

      function renderAnswerOptions(data) {
        [...buttons.querySelectorAll(".answer-btn")].forEach((button, index) => {
          const text = button.querySelector("strong");
          text.textContent = (data.options || [])[index] || "";
        });
      }

      function renderPlayerResult(data) {
        stopTimer();
        buttons.classList.add("hidden");
        if (data.correct) {
          statusMsg.textContent = `Corretta! +${data.points} pt`;
          resultBox.textContent = `Totale: ${data.score} pt. Risposta esatta: ${data.correct_text}`;
          resultBox.className = "player-result success";
        } else {
          statusMsg.textContent = "Risposta non corretta";
          resultBox.textContent = `Totale: ${data.score} pt. Risposta esatta: ${data.correct_text}`;
          resultBox.className = "player-result error";
        }
      }

      socket.on("join_success", (data) => {
        joined = true;
        localStorage.setItem(playerIdKey, data.player_id);
        localStorage.setItem(playerNameKey, data.name);
        showGame();
      });

      socket.on("join_error", (data) => {
        errorMsg.textContent = data.message || "Impossibile entrare nel quiz.";
      });

      socket.on("connect_error", () => {
        errorMsg.textContent = "Telefono non collegato al server. Controlla Wi-Fi e indirizzo del QR.";
      });

      socket.on("new_question", (data) => {
        answered = false;
        resultBox.classList.add("hidden");
        resultBox.textContent = "";
        statusMsg.textContent = "Scegli la risposta";
        renderAnswerOptions(data);
        buttons.classList.remove("hidden");
        startTimer(data.time || 35);
      });

      socket.on("question_results", () => {
        stopTimer();
        buttons.classList.add("hidden");
      });

      socket.on("player_result", (data) => {
        renderPlayerResult(data);
      });

      socket.on("game_over", () => {
        stopTimer();
        statusMsg.textContent = "Quiz finito";
        buttons.classList.add("hidden");
      });

      socket.on("game_reset", (data) => {
        stopTimer();
        answered = false;
        joined = false;
        if (data.clear_players) {
          localStorage.removeItem(playerIdKey);
          localStorage.removeItem(playerNameKey);
          document.getElementById("name").value = "";
          login.classList.remove("hidden");
          game.classList.add("hidden");
        }
        statusMsg.textContent = "Attendi la domanda";
        resultBox.classList.add("hidden");
        buttons.classList.add("hidden");
      });

      socket.on("game_state", (state) => {
        showGame();
        if (state.phase === "question" && state.question) {
          resultBox.classList.add("hidden");
          resultBox.textContent = "";
          renderAnswerOptions(state.question);
          startTimer(state.question.remaining ?? state.question.time);
          answered = Boolean(state.answered);
          if (answered) {
            buttons.classList.add("hidden");
            statusMsg.textContent = "Risposta inviata";
          } else {
            buttons.classList.remove("hidden");
            statusMsg.textContent = "Scegli la risposta";
          }
          return;
        }

        if (state.phase === "results") {
          answered = true;
          if (state.player_result) {
            renderPlayerResult(state.player_result);
          } else {
            stopTimer();
            buttons.classList.add("hidden");
            statusMsg.textContent = "Attendi la prossima domanda";
          }
          return;
        }

        if (state.phase === "game_over") {
          stopTimer();
          buttons.classList.add("hidden");
          statusMsg.textContent = "Quiz finito";
          return;
        }

        stopTimer();
        answered = false;
        buttons.classList.add("hidden");
        resultBox.classList.add("hidden");
        statusMsg.textContent = "Attendi la domanda";
      });

      function sendAnswer(index) {
        if (answered) {
          return;
        }
        answered = true;
        socket.emit("submit_answer", { answer: index });
        buttons.classList.add("hidden");
        statusMsg.textContent = "Risposta inviata";
      }

      socket.on("connect", () => {
        if (joined) {
          return;
        }
        const pin = document.getElementById("pin").value.trim();
        const name = document.getElementById("name").value.trim();
        if (pin && name && localStorage.getItem(playerIdKey)) {
          join();
        }
      });
    </script>
  </body>
</html>
